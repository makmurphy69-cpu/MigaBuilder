name: Tool explanation videos

# Every tool on the homepage must ship with a narrated explanation video.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every tool has a video, poster, transcript and scenario
        run: node scripts/check-tool-videos.mjs
