name: Tool result tests

# Drives the main tools with small sample files and checks the files they produce
# (MP4/MP3, OCR text and searchable PDF, PDF order and split, QR scan-back, CV PDF text,
# compressed PDF, Website Builder ZIP and App Forge self-fix with canned AI answers).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.56.1
          # Ubuntu's package servers sometimes stall (no output for 20 minutes), so give
          # apt network timeouts and retry the install instead of losing the whole job.
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-timeouts
          for i in 1 2 3; do
            timeout 300 playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            echo "::warning::Browser install stalled or failed (try $i of 3); retrying"
            sudo pkill -f apt-get || true
            sleep 10
          done
      - name: Main tools produce the right files
        run: node scripts/result-tests.mjs
