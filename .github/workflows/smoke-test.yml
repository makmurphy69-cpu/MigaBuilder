name: Page smoke test

# Opens every page in Chromium and fails on JavaScript errors or missing files.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-24.04  # Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # /es/, /ar/ … are copies of the English pages; this fails when an English page changed
      # without running: node scripts/build-language-pages.mjs
      - name: Language pages are up to date
        run: node scripts/build-language-pages.mjs --check
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.56.1
          # Ubuntu's package servers sometimes stall (no output for 20 minutes), so give
          # apt network timeouts and retry the install instead of losing the whole job.
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-timeouts
          for i in 1 2 3; do
            timeout 300 playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            echo "::warning::Browser install stalled or failed (try $i of 3); retrying"
            sudo pkill -f apt-get || true
            sleep 10
          done
      - name: Every page loads without JavaScript errors
        run: node scripts/smoke-test.mjs
      - name: Language pages open in their own language
        run: node scripts/smoke-test.mjs es/index es/pdf-compress ar/index ar/qr-forge zh/cv-forge sw/image-studio sv/invoice-forge de/grammar-forge pt/voice-forge fr/document-forge
