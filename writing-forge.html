<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#081826"><script src="/sw-register.js" defer></script><script src="/web-analytics.js" defer></script><script src="usage-counter.js" defer></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Writing Forge — summarize, clean and transform text</title><meta name="description" content="Summarize, clean, count and transform text privately in your browser."><link rel="stylesheet" href="local-tools.css"><link rel="stylesheet" href="tutorials.css">
</head><body><nav class="tool-nav"><a href="index.html">← All tools</a><span>Writing Forge</span></nav><header class="masthead"><div><h1>Writing Forge</h1><p>Summarize, clean and reshape text without sending it anywhere.</p></div></header><main><section class="panel"><p class="privacy">🔒 Text stays on this device. Results are rule-based and should be reviewed.</p><div class="field"><label for="input">Your text</label><textarea id="input" style="min-height:220px" placeholder="Paste an article, draft or notes…"></textarea></div><div class="actions"><button class="primary tool" data-mode="summary">Summarize</button><button class="secondary tool" data-mode="clean">Clean spacing</button><button class="secondary tool" data-mode="sentences">Shorten sentences</button><button class="secondary tool" data-mode="title">Title Case</button><button class="secondary tool" data-mode="lower">lowercase</button><button class="secondary tool" data-mode="upper">UPPERCASE</button></div><div class="field" style="margin-top:15px"><label for="output">Result</label><textarea id="output" style="min-height:220px"></textarea></div><div class="actions"><button class="primary" id="copy">Copy result</button><button class="secondary" id="download">Download TXT</button></div><div class="status show" id="stats">0 words · 0 characters · about 0 min read</div></section></main><footer>Part of <a href="index.html">MigaBuilder</a>.</footer><script>
const $=id=>document.getElementById(id);function stats(){const s=$('input').value.trim(),n=s?s.split(/\s+/).length:0;$('stats').textContent=`${n} words · ${s.length} characters · about ${Math.ceil(n/220)||0} min read`}function summarize(s){const sent=s.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[],freq={};(s.toLowerCase().match(/[a-zà-ÿ]{4,}/g)||[]).forEach(w=>{if(!/^(that|this|with|from|have|were|will|your|about|there|their|would|could|should)$/.test(w))freq[w]=(freq[w]||0)+1});return sent.map((v,i)=>({v:v.trim(),i,score:(v.toLowerCase().match(/[a-zà-ÿ]{4,}/g)||[]).reduce((a,w)=>a+(freq[w]||0),0)})).sort((a,b)=>b.score-a.score).slice(0,Math.max(1,Math.min(5,Math.ceil(sent.length*.3)))).sort((a,b)=>a.i-b.i).map(x=>x.v).join(' ')}
$('input').oninput=stats;document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{let s=$('input').value;const m=b.dataset.mode;if(m==='summary')s=summarize(s);if(m==='clean')s=s.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').replace(/\s+([,.;!?])/g,'$1').trim();if(m==='sentences')s=s.replace(/;\s+/g,'. ').replace(/,\s+(and|but|so)\s+/gi,'. $1 ').replace(/\b(in order to)\b/gi,'to');if(m==='title')s=s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());if(m==='lower')s=s.toLowerCase();if(m==='upper')s=s.toUpperCase();$('output').value=s});$('copy').onclick=async()=>navigator.clipboard.writeText($('output').value);$('download').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([$('output').value],{type:'text/plain'}));a.href=u;a.download='migabuilder-writing.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};stats();
</script><script src="tutorials.js" defer></script>
</body></html>
