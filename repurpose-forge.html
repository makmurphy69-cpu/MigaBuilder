<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#081826"><script src="/sw-register.js" defer></script><script src="/web-analytics.js" defer></script><link rel="canonical" href="https://migabuilder.com/repurpose-forge.html">
<script src="usage-counter.js" defer></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repurpose Forge — turn one idea into many formats</title><meta name="description" content="Turn one piece of content into social posts, a newsletter, video script, blog outline and advertisement locally."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="local-tools.css"><link rel="stylesheet" href="tutorials.css"><script src="i18n.js"></script>
<script src="i18n/repurpose-forge.js"></script>
</head><body><header class="masthead"><div><h1>Content Repurpose Forge</h1><p>Transform one idea into a complete publishing pack—locally.</p></div></header><main><section class="panel"><p class="privacy">🔒 Your source text never leaves this browser. This tool uses structured local templates, not a remote AI service.</p><div class="field"><label for="source">Original content or idea</label><textarea id="source" placeholder="Paste an article, product description, lesson, announcement, or rough idea."></textarea><label for="sourceFile" class="muted">Or import a .txt or .md file (up to 1 MB; read locally)</label><input id="sourceFile" type="file" accept=".txt,.md,text/plain,text/markdown"></div><div class="grid"><div class="field"><label for="audience">Audience</label><input id="audience" placeholder="Small-business owners"></div><div class="field"><label for="goal">Call to action</label><input id="goal" placeholder="Try the free tool"></div></div><button class="primary" id="generate">Create publishing pack</button></section><section class="panel"><h2>Publishing pack</h2><div id="outputs"></div></section></main><footer>Part of <a href="index.html">MigaBuilder</a>. Review and personalise generated drafts before publishing.</footer><script>(function(){const $=id=>document.getElementById(id),types=['LinkedIn post','Short social post','Newsletter introduction','YouTube description','60-second video script','Blog outline','Advertisement'];function clean(s){return s.trim().replace(/\s+/g,' ')}function build(type,text,audience,goal){const first=(text.split(/[.!?]/)[0]||text).slice(0,160),cta=goal||'Learn more';if(type==='LinkedIn post')return first+'\n\nWhy it matters for '+audience+':\n• A clearer problem\n• A practical solution\n• A useful next step\n\n'+cta+'.\n\n#Productivity #Ideas #MigaBuilder';if(type==='Short social post')return first+' — '+cta+'. #MigaBuilder';if(type==='Newsletter introduction')return 'Subject: '+first.slice(0,55)+'\n\nHello,\n\n'+text+'\n\nThe practical takeaway for '+audience+' is simple: start with one useful step and improve from there.\n\n'+cta+'.';if(type==='YouTube description')return first+'\n\nIn this video:\n00:00 Introduction\n00:15 The problem\n00:35 The solution\n00:50 Next steps\n\n'+cta+'.';if(type==='60-second video script')return '[HOOK]\n'+first+'\n\n[PROBLEM]\nWhat makes this difficult for '+audience+'?\n\n[SOLUTION]\n'+text.slice(0,420)+'\n\n[CALL TO ACTION]\n'+cta+'.';if(type==='Blog outline')return '# '+first+'\n\n1. The problem\n2. Why it matters to '+audience+'\n3. The practical solution\n4. Common mistakes\n5. Step-by-step implementation\n6. Conclusion: '+cta;return 'Headline: '+first+'\n\nFor '+audience+': '+text.slice(0,260)+'\n\n'+cta+'.'}function render(){const text=clean($('source').value);if(!text)return;const a=$('audience').value.trim()||'your audience',g=$('goal').value.trim(),root=$('outputs');root.innerHTML='';types.forEach(t=>{const card=document.createElement('div');card.className='item';card.style.display='block';const h=document.createElement('strong'),pre=document.createElement('div'),btn=document.createElement('button');h.textContent=t;pre.className='result';pre.style.margin='8px 0';pre.textContent=build(t,text,a,g);btn.className='secondary';btn.textContent='Copy';btn.onclick=()=>navigator.clipboard.writeText(pre.textContent);card.append(h,pre,btn);root.appendChild(card)});localStorage.setItem('miga-repurpose-draft',JSON.stringify({text,audience:a,goal:g}))}$('sourceFile').addEventListener('change',async()=>{const f=$('sourceFile').files[0];if(!f)return;if(f.size>1048576){alert('Choose a text file smaller than 1 MB.');$('sourceFile').value='';return}if(!/\.(txt|md)$/i.test(f.name)){alert('Choose a .txt or .md file.');$('sourceFile').value='';return}try{$('source').value=await f.text()}catch(e){alert('Could not read that file.')}finally{$('sourceFile').value=''}});$('generate').onclick=render;try{const d=JSON.parse(localStorage.getItem('miga-repurpose-draft'));if(d){$('source').value=d.text||'';$('audience').value=d.audience||'';$('goal').value=d.goal||'';render()}}catch(e){}})();</script><script src="tutorials.js" defer></script></body></html>
