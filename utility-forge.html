<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#081826"><script src="/sw-register.js" defer></script><script src="/web-analytics.js" defer></script><link rel="canonical" href="https://migabuilder.com/utility-forge.html">
<script src="usage-counter.js" defer></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Utility Forge — private CSV, JSON, text and checksum tools</title><meta name="description" content="Convert CSV and JSON, combine text files and calculate SHA-256 checksums locally in your browser."><link rel="stylesheet" href="local-tools.css"><link rel="stylesheet" href="tutorials.css"><script src="i18n.js"></script>
<script src="i18n/utility-forge.js"></script>
</head>
<body><nav class="tool-nav"><a href="index.html">← All tools</a><span>Utility Forge</span></nav><header class="masthead"><div><h1>Utility Forge</h1><p>Small file jobs, completed privately in your browser.</p></div></header><main>
<section class="panel"><p class="privacy">🔒 Files and pasted data stay on this device. Nothing is uploaded to MigaBuilder.</p><div class="cards">
<button class="card mode" data-mode="csvjson"><strong>CSV ↔ JSON</strong><small>Convert structured data in either direction.</small></button>
<button class="card mode" data-mode="combine"><strong>Combine text files</strong><small>Join TXT, CSV, Markdown or log files.</small></button>
<button class="card mode" data-mode="hash"><strong>SHA-256 checksum</strong><small>Verify a file without uploading it.</small></button></div></section>
<section class="panel" id="csvjson"><h2>CSV ↔ JSON</h2><div class="field"><label for="direction">Conversion</label><select id="direction"><option value="csv-json">CSV to JSON</option><option value="json-csv">JSON to CSV</option></select></div><div class="field"><label for="dataInput">Paste data</label><textarea id="dataInput" placeholder="name,email&#10;Alex,alex@example.com"></textarea></div><div class="actions"><button class="primary" id="convert">Convert</button><button class="secondary" id="downloadData">Download result</button></div><div class="field" style="margin-top:14px"><label for="dataOutput">Result</label><textarea id="dataOutput" readonly></textarea></div><div class="status" id="dataStatus"></div></section>
<section class="panel" id="combine" hidden><h2>Combine text files</h2><div class="field"><label for="textFiles">Text files</label><input id="textFiles" type="file" accept=".txt,.md,.csv,.json,.log,text/*" multiple></div><div class="field"><label for="separator">Separator between files</label><input id="separator" value="\n\n---\n\n"></div><div class="actions"><button class="primary" id="combineBtn">Combine and download</button></div><div class="status" id="combineStatus"></div></section>
<section class="panel" id="hash" hidden><h2>SHA-256 checksum</h2><div class="field"><label for="hashFile">Choose a file</label><input id="hashFile" type="file"></div><div class="actions"><button class="primary" id="hashBtn">Calculate checksum</button><button class="secondary" id="copyHash">Copy</button></div><div class="result" id="hashResult" style="min-height:60px;word-break:break-all"></div><div class="status" id="hashStatus"></div></section>
</main><footer>Part of <a href="index.html">MigaBuilder</a>. No account and no customer-file storage.</footer>
<script>
const $=id=>document.getElementById(id), modes=['csvjson','combine','hash'];
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{modes.forEach(x=>$(x).hidden=x!==b.dataset.mode)});
function status(id,msg){$(id).textContent=msg;$(id).classList.add('show')}
function save(text,name,type='text/plain'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function parseCSV(s){const rows=[];let row=[],cell='',q=false;for(let i=0;i<s.length;i++){const c=s[i],n=s[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"'){q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v!==''))rows.push(row);if(!rows.length)return[];const heads=rows.shift();return rows.map(r=>Object.fromEntries(heads.map((h,i)=>[h.trim()||'column_'+(i+1),r[i]??''])))}
function csvCell(v){v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$('convert').onclick=()=>{try{let out;if($('direction').value==='csv-json')out=JSON.stringify(parseCSV($('dataInput').value),null,2);else{const arr=JSON.parse($('dataInput').value);if(!Array.isArray(arr))throw Error('JSON must be an array of objects.');const heads=[...new Set(arr.flatMap(Object.keys))];out=heads.map(csvCell).join(',')+'\n'+arr.map(o=>heads.map(h=>csvCell(o[h])).join(',')).join('\n')}$('dataOutput').value=out;status('dataStatus','Converted locally. Review the result, then download it.')}catch(e){status('dataStatus','Could not convert: '+e.message)}};
$('downloadData').onclick=()=>{if(!$('dataOutput').value)return status('dataStatus','Convert some data first.');const json=$('direction').value==='csv-json';save($('dataOutput').value,json?'converted.json':'converted.csv',json?'application/json':'text/csv')};
$('combineBtn').onclick=async()=>{const fs=[...$('textFiles').files];if(!fs.length)return status('combineStatus','Choose at least one text file.');const parts=[];for(const f of fs)parts.push(await f.text());save(parts.join($('separator').value.replace(/\\n/g,'\n')),'combined.txt');status('combineStatus',fs.length+' files combined and downloaded.')};
$('hashBtn').onclick=async()=>{const f=$('hashFile').files[0];if(!f)return status('hashStatus','Choose a file first.');if(!crypto.subtle)return status('hashStatus','Secure checksum support is unavailable in this browser.');const buf=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());$('hashResult').textContent=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');status('hashStatus','Checksum calculated locally for '+f.name+'.')};
$('copyHash').onclick=async()=>{if(!$('hashResult').textContent)return status('hashStatus','Calculate a checksum first.');await navigator.clipboard.writeText($('hashResult').textContent);status('hashStatus','Checksum copied.')};
</script><script src="tutorials.js" defer></script></body></html>
