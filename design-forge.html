<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#081826"><script src="/sw-register.js" defer></script><script src="/web-analytics.js" defer></script><script src="usage-counter.js" defer></script><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="canonical" href="https://migabuilder.com/image-studio.html"><meta http-equiv="refresh" content="0; url=image-studio.html"><script>location.replace("image-studio.html");</script><title>Design Forge — thumbnails, memes and collages</title><meta name="description" content="Create YouTube thumbnails, memes and photo collages locally in your browser."><link rel="stylesheet" href="local-tools.css"><link rel="stylesheet" href="tutorials.css">
</head><body><nav class="tool-nav"><a href="index.html">← All tools</a><span>Design Forge</span></nav><header class="masthead"><div><h1>Design Forge</h1><p>Create thumbnails, memes and collages on one private canvas.</p></div></header><main><section class="panel"><p class="privacy">🔒 Your images stay in this browser.</p><div class="grid"><div><div class="field"><label for="preset">Format</label><select id="preset"><option value="1280,720">YouTube thumbnail · 1280 × 720</option><option value="1080,1080">Square post · 1080 × 1080</option><option value="1080,1920">Story · 1080 × 1920</option><option value="1200,630">Social link · 1200 × 630</option></select></div><div class="field"><label for="images">Images (up to 9)</label><input id="images" type="file" accept="image/*" multiple></div><div class="field"><label for="headline">Headline</label><textarea id="headline" placeholder="Type your headline"></textarea></div><div class="grid"><div class="field"><label for="layout">Layout</label><select id="layout"><option value="grid">Grid collage</option><option value="hero">Hero image</option></select></div><div class="field"><label for="color">Text colour</label><input id="color" type="color" value="#ffffff"></div></div><div class="actions"><button class="primary" id="render">Create design</button><button class="secondary" id="save">Download PNG</button></div><div class="status" id="status"></div></div><canvas id="canvas" width="1280" height="720" style="width:100%;background:#081826;border:1px solid rgba(22,32,43,.2)"></canvas></div></section></main><footer>Part of <a href="index.html">MigaBuilder</a>.</footer><script>
const $=id=>document.getElementById(id),c=$('canvas'),g=c.getContext('2d');let pics=[];function note(s){$('status').textContent=s;$('status').classList.add('show')}function fit(im,x,y,w,h){const s=Math.max(w/im.width,h/im.height),sw=w/s,sh=h/s,sx=(im.width-sw)/2,sy=(im.height-sh)/2;g.drawImage(im,sx,sy,sw,sh,x,y,w,h)}
$('images').onchange=async()=>{pics=[];for(const f of [...$('images').files].slice(0,9)){const im=new Image;im.src=URL.createObjectURL(f);await im.decode();pics.push(im)}draw()};['preset','layout','color','headline'].forEach(id=>$(id).oninput=draw);
function draw(){const [w,h]=$('preset').value.split(',').map(Number);c.width=w;c.height=h;g.fillStyle='#0E2A47';g.fillRect(0,0,w,h);if(pics.length){if($('layout').value==='hero')fit(pics[0],0,0,w,h);else{const cols=Math.ceil(Math.sqrt(pics.length)),rows=Math.ceil(pics.length/cols),cw=w/cols,ch=h/rows;pics.forEach((im,i)=>fit(im,(i%cols)*cw,Math.floor(i/cols)*ch,cw,ch))}}const t=$('headline').value.trim();if(t){g.fillStyle='rgba(0,0,0,.48)';g.fillRect(0,h*.64,w,h*.36);g.fillStyle=$('color').value;g.textAlign='center';g.textBaseline='middle';g.font=`800 ${Math.round(Math.max(34,Math.min(92,w/(Math.max(8,t.length*.55)))))}px Arial`;const words=t.split(/\s+/),lines=[];let line='';for(const word of words){const next=(line+' '+word).trim();if(g.measureText(next).width>w*.88&&line){lines.push(line);line=word}else line=next}if(line)lines.push(line);const lh=parseInt(g.font)*1.08,start=h*.82-(lines.length-1)*lh/2;lines.slice(0,4).forEach((s,i)=>{g.strokeStyle='rgba(0,0,0,.75)';g.lineWidth=Math.max(4,w/220);g.strokeText(s,w/2,start+i*lh);g.fillText(s,w/2,start+i*lh)})}note('Preview updated locally.')}
$('render').onclick=draw;$('save').onclick=()=>{draw();const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='migabuilder-design.png';a.click()};draw();
</script><script src="tutorials.js" defer></script>
</body></html>
